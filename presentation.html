<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스킬노트 발표 | PDF 뷰어 + 프로토타입</title>
  <style>
    :root {
      --bg: #f7f6fc;
      --blue: #3655dd;
      --blue-soft: #edf1ff;
      --ink: #1c2440;
      --muted: #687185;
      --line: #e2e5ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      overflow: hidden;
    }
    header {
      background: white;
      border-bottom: 1px solid var(--line);
      height: 64px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
    .brand img { width: 32px; height: 32px; border-radius: 8px; }
    .tabs { display: flex; gap: 8px; align-items: center; }
    .tab {
      background: white; border: 1px solid var(--line); border-radius: 10px;
      padding: 8px 16px; font-weight: 600; cursor: pointer; color: var(--ink);
    }
    .tab.active { background: var(--blue); color: white; border-color: var(--blue); }
    #fullscreen-btn, #reset-btn {
      background: white; border: 1px solid var(--line); border-radius: 10px;
      padding: 8px 14px; font-weight: 600; cursor: pointer;
    }
    #fullscreen-btn:hover, #reset-btn:hover { background: var(--blue-soft); }

    .view { display: none; }
    .view.active { display: block; }
    #view-demo.active { height: calc(100vh - 64px); overflow: auto; }
    #view-pdf.active { display:flex; height:calc(100dvh - 64px); }

    /* PDF */
    .pdf-container {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow: auto;
    }
    .pdf-toolbar {
      background: white; border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 16px; display: flex; align-items: center; gap: 12px;
      margin-bottom: 16px; flex-wrap: wrap; flex-shrink: 0;
    }
    .pdf-toolbar button, .pdf-toolbar label.btn {
      background: white; border: 1px solid var(--line); border-radius: 8px;
      padding: 8px 14px; font-weight: 600; cursor: pointer;
    }
    .pdf-canvas-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: safe center;
      justify-content: safe center;
      overflow: auto;
    }
    #pdf-canvas {
      flex: 0 0 auto;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      border-radius: 8px;
      background: white;
    }
    .pdf-page-info { color: var(--muted); font-weight: 600; }
    #view-pdf:fullscreen { width:100%; height:100%; background:#000; cursor:none; }
    #view-pdf:fullscreen .pdf-container { padding:0; overflow:hidden; }
    #view-pdf:fullscreen .pdf-toolbar,
    #view-pdf:fullscreen #pdf-status { display:none !important; }
    #view-pdf:fullscreen .pdf-canvas-wrap { overflow:hidden; }
    #view-pdf:fullscreen #pdf-canvas { display:block; border-radius:0; box-shadow:none; }
    .upload-area {
      border: 2px dashed var(--line); border-radius: 16px; padding: 60px 20px;
      text-align: center; background: white; margin: auto;
      max-width: 500px;
    }
    .upload-area.dragover { border-color: var(--blue); background: var(--blue-soft); }
    .status { margin-top: 16px; color: var(--muted); font-size: 14px; }
    .status:empty { display:none; }
    .error { color: #d32f2f; }

    /* Phone frame */
    /* Phone on the left, diagram area on the right */
    .phone-container {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 40px;
      min-height: calc(100vh - 64px);
      padding: 20px 48px;
      background: #e8eaf0;
    }
    .demo-side {
      flex: 1;
      min-width: 0;
      align-self: stretch;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
    }
    .demo-side:empty, .demo-side:has(> .demo-side-empty) {
      border: 2px dashed #c3c8d6;
      border-radius: 20px;
    }
    .demo-side-empty { color: #8a90a2; font-size: 15px; }
    .demo-side figure { margin: 0; width: 100%; max-width: 860px; background: white; border-radius: 20px; padding: 22px 24px 16px; box-shadow: 0 4px 18px rgba(28,36,64,0.08); }
    .demo-side figcaption { font-size: 18px; font-weight: 700; color: #1c2440; margin-bottom: 6px; }

    .demo-side figure svg { display: block; width: 100%; height: auto; font-family: inherit; }
    .demo-side img, .demo-side svg { max-width: 100%; max-height: calc(100vh - 110px); }
    @media (max-width: 900px) {
      .phone-container { justify-content: center; padding: 20px; }
      .demo-side { display: none; }
    }
    .phone {
      width: 390px;
      height: min(780px, calc(100dvh - 104px));
      background: #1a1a1a;
      border-radius: 40px;
      padding: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      position: relative;
      flex-shrink: 0;
    }
    .phone::before {
      content: ""; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      width: 120px; height: 24px; background: #1a1a1a; border-radius: 0 0 16px 16px; z-index: 10;
    }
    .phone-screen {
      width: 100%; height: 100%; border-radius: 32px; overflow: hidden; background: white;
    }
    #demo-frame {
      width: 100%; height: 100%; border: none; display: block;
    }

    /* Fullscreen styles */
    html:fullscreen .phone {
      height: min(860px, calc(100dvh - 104px));
    }
    #diagram-toggle { display: none; }
    .demo-side figure { box-sizing: border-box; }
    @media (max-width: 900px) {
      .phone-container { flex-direction:column; height:auto; gap:14px; padding:12px; }
      .phone, html:fullscreen .phone { box-sizing:border-box; width:min(414px,100%); height:clamp(410px,78dvh,780px); }
      #diagram-toggle { display:block; min-height:44px; padding:8px 14px; border:1px solid #c3cbea; border-radius:8px; background:white; color:#2944aa; font:inherit; cursor:pointer; }
      #diagram-toggle[aria-expanded="true"] + .demo-side { display:block; width:100%; }
      .demo-side figure { padding:12px; }
      .demo-side figure svg { min-width:580px; }
    }
  </style>
</head>
<body>

    <div class="tabs">
      <button class="tab active" data-view="pdf">PDF 슬라이드</button>
      <button class="tab" data-view="demo">스킬노트 데모 (휴대폰)</button>

  <div id="view-pdf" class="view active" tabindex="-1">
    <div class="pdf-container">
      <div class="pdf-toolbar" id="pdf-toolbar" style="display:none;">
        <button id="pdf-prev">← 이전</button>
        <span class="pdf-page-info" id="pdf-page-info">1 / 1</span>
        <button id="pdf-next">다음 →</button>
        <span style="flex:1"></span>
        <button id="pdf-zoom-out">-</button>
        <button id="pdf-zoom-in">+</button>
        <button id="pdf-fit">화면에 맞추기</button>
        <label class="btn">
          다른 PDF 열기
          <input type="file" id="pdf-upload" accept=".pdf,application/pdf" hidden>
        </label>
      </div>
      <div id="pdf-drop" class="upload-area">
        <h2 style="margin:0 0 8px;">PDF 슬라이드 업로드</h2>
        <p style="color:var(--muted); margin:0 0 20px;">이미 만들어진 PDF 파일을 드래그하거나 선택하세요.</p>
        <label class="btn" style="background:var(--blue);color:white;border:none;padding:12px 24px;border-radius:10px;font-weight:700;cursor:pointer;">
          PDF 선택
          <input type="file" id="pdf-upload-main" accept=".pdf,application/pdf" hidden>
        </label>
      </div>
      <div class="status" id="pdf-status" role="status"></div>
      <div class="pdf-canvas-wrap" id="pdf-canvas-wrap" style="display:none;">
        <canvas id="pdf-canvas"></canvas>
      </div>
    </div>
  </div>

  <div id="view-demo" class="view">
    <div class="phone-container">
      <div class="phone">
        <div class="phone-screen">
          <iframe id="demo-frame" title="스킬노트 프로토타입"></iframe>
        </div>
      </div>
      <button id="diagram-toggle" type="button" aria-controls="demo-side" aria-expanded="false">처리 흐름 보기</button>
      <div class="demo-side" id="demo-side">
        <p class="demo-side-empty">휴대폰을 조작하면 처리 흐름이 표시됩니다.</p>
      </div>
    </div>
  </div>

  <script src="./skillnote/pdfjs/pdf.worker.min.js"></script>
  <script src="./skillnote/pdfjs/pdf.min.js"></script>
  <script>
    // Tabs
    document.querySelectorAll('.tab[data-view]').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tab[data-view]').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('view-' + btn.dataset.view).classList.add('active');
        if (btn.dataset.view === 'demo') initDemo();
        else if (pendingFit) fitToScreen();
      };
    });

    // Fullscreen
    const fsBtn = document.getElementById('fullscreen-btn');
    const pdfView = document.getElementById('view-pdf');
    let pdfWasFullscreen = false;
    fsBtn.onclick = async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else if (pdfView.classList.contains('active')) {
          if (!pdfDoc || loading) {
            setStatus('전체화면으로 보기 전에 PDF를 열어 주세요.',true);
            return;
          }
          await pdfView.requestFullscreen();
        }
        else await document.documentElement.requestFullscreen();
      } catch {
        alert('이 화면에서 전체화면을 전환할 수 없습니다.');
      }
    };
    document.addEventListener('fullscreenchange', () => {
      fsBtn.textContent = document.fullscreenElement ? '⛶ 전체화면 종료' : '⛶ 전체화면';
      const pdfFullscreen = document.fullscreenElement === pdfView;
      if (pdfFullscreen) pdfView.focus({preventScroll:true});
      if (pdfFullscreen || pdfWasFullscreen) requestAnimationFrame(fitToScreen);
      pdfWasFullscreen = pdfFullscreen;
    });
    window.addEventListener('resize', () => {
      if (document.fullscreenElement === pdfView) requestAnimationFrame(fitToScreen);
    });

    // ===== PDF Viewer =====
    const statusEl = document.getElementById('pdf-status');
    function setStatus(msg, isError=false) {
      statusEl.textContent = msg;
      statusEl.className = 'status' + (isError ? ' error' : '');
    }

    const pdfAvailable = () => typeof pdfjsLib !== 'undefined' && typeof pdfjsWorker !== 'undefined';
    const missingPdfFiles = 'PDF 보기 파일을 찾지 못했습니다. ZIP을 모두 압축 해제하고 presentation.html을 열어 주세요.';
    if (!pdfAvailable()) setStatus(missingPdfFiles,true);

    let pdfDoc = null;
    let pageNum = 1;
    let scale = 1.2;
    let renderQueue = Promise.resolve();
    let renderRevision = 0;
    let loadRevision = 0;
    let loading = false;
    let pendingFit = false;
    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    const toolbar = document.getElementById('pdf-toolbar');
    const dropArea = document.getElementById('pdf-drop');
    const canvasWrap = document.getElementById('pdf-canvas-wrap');

    function renderPage(num, fit = false) {
      if (!pdfDoc || loading) return;
      const doc = pdfDoc;
      const revision = ++renderRevision;
      renderQueue = renderQueue.then(async () => {
        if (revision !== renderRevision) return;
        const page = await doc.getPage(num);
        if (revision !== renderRevision) return;
        if (fit) {
          const size = page.getViewport({scale:1});
          const padding = document.fullscreenElement === pdfView ? 0 : 40;
          const availableWidth = Math.max(1,canvasWrap.clientWidth - padding);
          const availableHeight = Math.max(1,canvasWrap.clientHeight - padding);
          scale = Math.min(availableWidth / size.width, availableHeight / size.height);
        }
        const viewport = page.getViewport({scale});
        const ratio = window.devicePixelRatio || 1;
        canvas.height = Math.ceil(viewport.height * ratio);
        canvas.width = Math.ceil(viewport.width * ratio);
        canvas.style.height = viewport.height + 'px';
        canvas.style.width = viewport.width + 'px';
        await page.render({canvasContext:ctx,viewport,transform:ratio === 1 ? null : [ratio,0,0,ratio,0,0]}).promise;
        if (revision !== renderRevision) return;
        document.getElementById('pdf-page-info').textContent = num + ' / ' + doc.numPages;
        setStatus('');
      }).catch(err => {
        if (revision === renderRevision) setStatus('페이지 렌더링 실패: ' + err.message, true);
      });
    }

    function fitToScreen() {
      if (!pdfDoc || loading) return;
      pendingFit = !canvasWrap.clientWidth || !canvasWrap.clientHeight;
      if (pendingFit) return;
      renderPage(pageNum,true);
    }

    async function loadPdf(file) {
      if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
        setStatus('PDF 파일만 업로드할 수 있습니다.', true);
        return;
      }
      if (!pdfAvailable()) {
        setStatus(missingPdfFiles,true);
        return;
      }
      const revision = ++loadRevision;
      renderRevision++;
      loading = true;
      setStatus('PDF 로딩 중...');
      try {
        const data = new Uint8Array(await file.arrayBuffer());
        if (revision !== loadRevision) return;
        const pdf = await pdfjsLib.getDocument({data,isEvalSupported:false}).promise;
        if (revision !== loadRevision) { await pdf.destroy(); return; }
        pdfDoc = pdf;
        pageNum = 1;
        dropArea.style.display = 'none';
        canvasWrap.style.display = 'flex';
        toolbar.style.display = 'flex';
        loading = false;
        fitToScreen();
      } catch (err) {
        if (revision === loadRevision) {
          loading = false;
          setStatus('PDF를 열 수 없습니다: ' + (err.message || err), true);
        }
      }
    }

    function setupUpload(input) {
      input.onchange = e => {
        const file = e.target.files[0];
        if (file) loadPdf(file);
        input.value = '';
      };
    }
    setupUpload(document.getElementById('pdf-upload-main'));
    setupUpload(document.getElementById('pdf-upload'));

    function stepSlide(direction) {
      if (loading || !pdfDoc) return;
      const next = pageNum + direction;
      if (next < 1 || next > pdfDoc.numPages) return;
      pageNum = next;
      if (document.fullscreenElement === pdfView) fitToScreen();
      else renderPage(pageNum);
    }
    document.getElementById('pdf-prev').onclick = () => stepSlide(-1);
    document.getElementById('pdf-next').onclick = () => stepSlide(1);
    window.addEventListener('keydown', event => {
      if (!pdfView.classList.contains('active') || !pdfDoc || event.defaultPrevented || event.isComposing
        || event.ctrlKey || event.metaKey || event.altKey
        || event.target.closest?.('input, textarea, select, [contenteditable]')) return;
      if (event.key === 'Escape' && document.fullscreenElement === pdfView) {
        event.preventDefault();
        document.exitFullscreen().catch(() => {});
        return;
      }
      const forward = ['ArrowRight',' ','Enter'].includes(event.key);
      if (!forward && event.key !== 'ArrowLeft') return;
      if ([' ','Enter'].includes(event.key) && event.target.closest?.('button, a, label')) return;
      event.preventDefault();
      stepSlide(forward ? 1 : -1);
    });
    document.getElementById('pdf-zoom-in').onclick = () => { scale = Math.min(3, scale + 0.15); renderPage(pageNum); };
    document.getElementById('pdf-zoom-out').onclick = () => { scale = Math.max(0.3, scale - 0.15); renderPage(pageNum); };
    document.getElementById('pdf-fit').onclick = fitToScreen;

    dropArea.addEventListener('dragover', e => { e.preventDefault(); dropArea.classList.add('dragover'); });
    dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
    dropArea.addEventListener('drop', e => {
      e.preventDefault();
      dropArea.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file) loadPdf(file);
    });

      "evidence": { diagram: READ, range: [0, 3] },
      "projects": { diagram: READ, range: [0, 3] },
      "activities": { diagram: READ, range: [0, 3] }
    };

    function sequenceSvg(messages, range) {
      const width = 760, top = 20, head = 36, step = 44, first = 104;
      const gap = (width - 160) / (ACTORS.length - 1);
      const x = index => 80 + gap * index;
      const bottom = first + step * (ROWS - 1) + 30;
      const text = value => String(value).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
      const lanes = ACTORS.map((name, index) =>
        `<line x1="${x(index)}" y1="${top + head}" x2="${x(index)}" y2="${bottom}" stroke="#c3c8d6" stroke-dasharray="5 5"/>` +
        `<rect x="${x(index) - 48}" y="${top}" width="96" height="${head}" rx="9" fill="#edf1ff" stroke="#3655dd"/>` +
        `<text x="${x(index)}" y="${top + 23}" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2440">${text(name)}</text>`).join("");
      const arrows = messages.map(([from, to, label, reply], index) => {
        const y = first + step * index;
        const tip = x(to) + (to > from ? -2 : 2);
        return `<line x1="${x(from)}" y1="${y}" x2="${tip}" y2="${y}" stroke="${reply ? "#7a86a8" : "#3655dd"}" stroke-width="1.6" ${reply ? 'stroke-dasharray="6 4"' : ""} marker-end="url(#${reply ? "reply" : "call"})"/>` +
          `<text x="${(x(from) + x(to)) / 2}" y="${y - 8}" text-anchor="middle" font-size="13" fill="#1c2440" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">${index + 1}. ${text(label)}</text>`;
      }).join("");
      // Darken the timeline before and after the lit interval.
      let shade = "";
      if (range && !range.length) {
        shade = `<rect x="0" y="${top + head + 6}" width="${width}" height="${bottom + 10 - (top + head + 6)}" fill="#1c2440" opacity="0.5"/>`;
      } else if (range) {
        const from = first + step * range[0] - step / 2 - 4;
        const to = first + step * range[1] + step / 2 - 12;
        const band = (y1, y2) => y2 > y1 ? `<rect x="0" y="${y1}" width="${width}" height="${y2 - y1}" fill="#1c2440" opacity="0.5"/>` : "";
        shade = band(top + head + 6, from) + band(to, bottom + 10) +
          `<rect x="6" y="${from}" width="${width - 12}" height="${to - from}" rx="10" fill="none" stroke="#3655dd" stroke-width="2"/>`;
      }
      const marker = (id, color) => `<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="${color}"/></marker>`;
      return `<svg viewBox="0 0 ${width} ${bottom + 10}" role="img" xmlns="http://www.w3.org/2000/svg"><defs>${marker("call", "#3655dd")}${marker("reply", "#7a86a8")}</defs>${lanes}${arrows}${shade}</svg>`;
    }

    function showDiagram(event) {
      const entry = EVENTS[event];
      if (!entry) return;
      const figure = document.createElement("figure");
      figure.innerHTML = sequenceSvg(entry.diagram.messages, entry.range);
      const caption = document.createElement("figcaption");
      caption.textContent = entry.diagram.title;
      figure.prepend(caption);
      document.getElementById("demo-side").replaceChildren(figure);
    }

    window.addEventListener("message", event => {
      const frame = document.getElementById("demo-frame");
      if (event.source !== frame.contentWindow || event.data?.source !== "skillnote") return;
      if (event.data.event === "reset-complete") {
        frame.srcdoc = frame.srcdoc;
        document.getElementById('demo-side').innerHTML = '<p class="demo-side-empty">휴대폰을 조작하면 처리 흐름이 표시됩니다.</p>';
      } else showDiagram(event.data.event);
    });

    const diagramToggle = document.getElementById("diagram-toggle");
    diagramToggle.addEventListener("click", () => {
      const open = diagramToggle.getAttribute("aria-expanded") !== "true";
      diagramToggle.setAttribute("aria-expanded", String(open));
      diagramToggle.textContent = open ? "처리 흐름 접기" : "처리 흐름 보기";
    });
    function requestDemoReset() {
      const frame = document.getElementById('demo-frame');
      const request = () => frame.contentWindow.postMessage({source:"skillnote-deck",event:"reset"}, "*");
      if (demoInitialized) request();
      else {
        frame.addEventListener("load", request, {once:true});
        initDemo();
      }
    }
    document.getElementById('reset-btn').addEventListener('click', requestDemoReset);
    const resetKeys = new Set();
    window.addEventListener("keydown", event => {
      if (!["KeyR","KeyE"].includes(event.code) || event.repeat || event.isComposing
        || event.ctrlKey || event.metaKey || event.altKey || event.shiftKey
        || event.target.closest?.("input, textarea, select, [contenteditable]")) return;
      resetKeys.add(event.code);
      if (resetKeys.size !== 2) return;
      event.preventDefault();
      resetKeys.clear();
      requestDemoReset();
    });
    window.addEventListener("keyup", event => resetKeys.delete(event.code));
    window.addEventListener("blur", () => resetKeys.clear());

    let demoInitialized = false;

    function initDemo() {
      if (demoInitialized) return;
      demoInitialized = true;
      try {
        const binary = atob(PROTOTYPE_B64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        // The base keeps the app's hash links inside the phone frame.
        const html = new TextDecoder('utf-8').decode(bytes)
          .replace('<html ', '<html data-presentation-demo ')
          .replace('<head>', '<head><base href="about:srcdoc">');
        document.getElementById('demo-frame').srcdoc = html;
      } catch (err) {
        console.error(err);
        document.getElementById('demo-frame').srcdoc = '<p style="padding:20px;color:red;">프로토타입 로드 실패</p>';
      }
    }
  </script>
</body>
</html>
