<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스킬노트 발표 | PDF 뷰어 + 프로토타입</title>
  <style>
    :root {
      --bg: #f7f6fc;
      --blue: #3655dd;
      --blue-soft: #edf1ff;
      --ink: #1c2440;
      --muted: #687185;
      --line: #e2e5ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      overflow: hidden;
    }
    header {
      background: white;
      border-bottom: 1px solid var(--line);
      height: 64px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
    .brand img { width: 32px; height: 32px; border-radius: 8px; }
    .tabs { display: flex; gap: 8px; align-items: center; }
    .tab {
      background: white; border: 1px solid var(--line); border-radius: 10px;
      padding: 8px 16px; font-weight: 600; cursor: pointer; color: var(--ink);
    }
    .tab.active { background: var(--blue); color: white; border-color: var(--blue); }
    #fullscreen-btn {
      background: white; border: 1px solid var(--line); border-radius: 10px;
      padding: 8px 14px; font-weight: 600; cursor: pointer;
    }
    #fullscreen-btn:hover { background: var(--blue-soft); }

    .view { display: none; }
    .view.active { display: block; }
    #view-demo.active { height: calc(100vh - 64px); overflow: auto; }

    /* PDF */
    .pdf-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow: auto;
    }
    .pdf-toolbar {
      background: white; border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 16px; display: flex; align-items: center; gap: 12px;
      margin-bottom: 16px; flex-wrap: wrap; flex-shrink: 0;
    }
    .pdf-toolbar button, .pdf-toolbar label.btn {
      background: white; border: 1px solid var(--line); border-radius: 8px;
      padding: 8px 14px; font-weight: 600; cursor: pointer;
    }
    .pdf-canvas-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
    }
    #pdf-canvas {
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      border-radius: 8px;
      max-width: 100%;
      max-height: 100%;
      background: white;
    }
    .pdf-page-info { color: var(--muted); font-weight: 600; }
    .upload-area {
      border: 2px dashed var(--line); border-radius: 16px; padding: 60px 20px;
      text-align: center; background: white; margin: auto;
      max-width: 500px;
    }
    .upload-area.dragover { border-color: var(--blue); background: var(--blue-soft); }
    .status { margin-top: 16px; color: var(--muted); font-size: 14px; }
    .error { color: #d32f2f; }

    /* Phone frame */
    .phone-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 64px);
      padding: 20px;
      background: #e8eaf0;
    }
    .phone {
      width: 390px;
      height: 780px;
      background: #1a1a1a;
      border-radius: 40px;
      padding: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      position: relative;
      flex-shrink: 0;
    }
    .phone::before {
      content: ""; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      width: 120px; height: 24px; background: #1a1a1a; border-radius: 0 0 16px 16px; z-index: 10;
    }
    .phone-screen {
      width: 100%; height: 100%; border-radius: 32px; overflow: hidden; background: white;
    }
    #demo-frame {
      width: 100%; height: 100%; border: none; display: block;
    }

    /* Fullscreen styles */
    .view:fullscreen {
      background: var(--bg);
      height: 100vh;
    }
    .view:fullscreen {
      background: var(--bg);
      height: 100vh;
    }
    .view:fullscreen .phone-container {
      min-height: 100vh;
      height: 100vh;
      padding: 0;
    }
    .view:fullscreen .phone {
      width: min(420px, 90vw);
      height: min(860px, 92vh);
    }
  </style>
</head>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    // Tabs
    document.querySelectorAll('.tab[data-view]').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tab[data-view]').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('view-' + btn.dataset.view).classList.add('active');
        if (btn.dataset.view === 'demo') initDemo();
      };
    });

    // Fullscreen
    const fsBtn = document.getElementById('fullscreen-btn');
    function getActiveView() {
      return document.querySelector('.view.active');
    }
    fsBtn.onclick = () => {
      const view = getActiveView();
      if (!document.fullscreenElement) {
        view.requestFullscreen().catch(err => {
          alert('전체화면을 지원하지 않는 브라우저입니다.');
        });
      } else {
        document.exitFullscreen();
      }
    };
    document.addEventListener('fullscreenchange', () => {
      fsBtn.textContent = document.fullscreenElement ? '⛶ 전체화면 종료' : '⛶ 전체화면';
    });

    // ===== PDF Viewer =====
    const statusEl = document.getElementById('pdf-status');
    function setStatus(msg, isError=false) {
      statusEl.textContent = msg;
      statusEl.className = 'status' + (isError ? ' error' : '');
    }

    if (typeof pdfjsLib === 'undefined') {
      setStatus('PDF.js를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.', true);
    } else {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    let pdfDoc = null;
    let pageNum = 1;
    let scale = 1.2;
    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    const toolbar = document.getElementById('pdf-toolbar');
    const dropArea = document.getElementById('pdf-drop');
    const canvasWrap = document.getElementById('pdf-canvas-wrap');

    function renderPage(num) {
      if (!pdfDoc) return;
      pdfDoc.getPage(num).then(page => {
        const viewport = page.getViewport({ scale });
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        return page.render({ canvasContext: ctx, viewport }).promise;
      }).then(() => {
        document.getElementById('pdf-page-info').textContent = num + ' / ' + pdfDoc.numPages;
        setStatus('');
      }).catch(err => {
        setStatus('페이지 렌더링 실패: ' + err.message, true);
      });
    }

    function fitToScreen() {
      if (!pdfDoc) return;
      pdfDoc.getPage(pageNum).then(page => {
        const wrap = canvasWrap;
        const maxW = wrap.clientWidth - 40;
        const maxH = wrap.clientHeight - 40;
        const unscaled = page.getViewport({ scale: 1 });
        const scaleW = maxW / unscaled.width;
        const scaleH = maxH / unscaled.height;
        scale = Math.min(scaleW, scaleH, 2.5);
        renderPage(pageNum);
      });
    }

    function loadPdf(file) {
      if (typeof pdfjsLib === 'undefined') {
        setStatus('PDF.js 라이브러리가 로드되지 않았습니다.', true);
        return;
      }
      setStatus('PDF 로딩 중...');
      const reader = new FileReader();
      reader.onload = () => {
        const typedarray = new Uint8Array(reader.result);
        pdfjsLib.getDocument({ data: typedarray }).promise.then(pdf => {
          pdfDoc = pdf;
          pageNum = 1;
          dropArea.style.display = 'none';
          canvasWrap.style.display = 'flex';
          toolbar.style.display = 'flex';
          renderPage(pageNum);
          setTimeout(fitToScreen, 100);
        }).catch(err => {
          setStatus('PDF를 열 수 없습니다: ' + (err.message || err), true);
          console.error(err);
        });
      };
      reader.onerror = () => setStatus('파일 읽기 실패', true);
      reader.readAsArrayBuffer(file);
    }

    function setupUpload(input) {
      input.onchange = e => {
        const file = e.target.files[0];
        if (file) {
          if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
            setStatus('PDF 파일만 업로드할 수 있습니다.', true);
            return;
          }
          loadPdf(file);
        }
        input.value = '';
      };
    }
    setupUpload(document.getElementById('pdf-upload-main'));
    setupUpload(document.getElementById('pdf-upload'));

    document.getElementById('pdf-prev').onclick = () => {
      if (pageNum <= 1) return;
      pageNum--;
      renderPage(pageNum);
    };
    document.getElementById('pdf-next').onclick = () => {
      if (!pdfDoc || pageNum >= pdfDoc.numPages) return;
      pageNum++;
      renderPage(pageNum);
    };
    document.getElementById('pdf-zoom-in').onclick = () => { scale = Math.min(3, scale + 0.15); renderPage(pageNum); };
    document.getElementById('pdf-zoom-out').onclick = () => { scale = Math.max(0.3, scale - 0.15); renderPage(pageNum); };
    document.getElementById('pdf-fit').onclick = fitToScreen;

    dropArea.addEventListener('dragover', e => { e.preventDefault(); dropArea.classList.add('dragover'); });
    dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
    dropArea.addEventListener('drop', e => {
      e.preventDefault();
      dropArea.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file) loadPdf(file);
