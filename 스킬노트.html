  <style>
:root {
  font-family: Inter, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color:#1c2440; background:#f7f8fb; font-synthesis:none;
  --blue:#3655dd; --ink:#1c2440; --muted:#687185; --line:#e2e5ee; --soft:#edf1ff;
  -webkit-text-size-adjust:100%;
}
* {box-sizing:border-box}
body {margin:0; min-height:100vh; word-break:keep-all; overflow-wrap:anywhere}
button, textarea {font:inherit}
button, a {touch-action:manipulation; -webkit-tap-highlight-color:transparent}
button {color:inherit; cursor:pointer; border:0; background:none}
a {color:inherit; text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible {outline:3px solid #6c87fb; outline-offset:3px}
button:disabled {opacity:.55; cursor:wait}
[hidden] {display:none !important}
h1,h2,h3,p {margin:0}
h1,h2,h3,strong,b {font-weight:750}
.ico {width:20px;height:20px;flex:none;display:inline-block;vertical-align:middle}
.topbar {height:62px;background:white;border-bottom:1px solid var(--line)}
.desktop-nav,main {width:min(1120px,calc(100% - 72px));margin:auto}
.desktop-nav {height:100%;display:flex;gap:27px;align-items:stretch}
.desktop-nav a {display:flex;align-items:center;gap:8px;color:#687185;font-size:15px;font-weight:650;position:relative;padding:1px 3px 0}
.desktop-nav .ico {width:18px;height:18px}
.desktop-nav [aria-current] {color:var(--blue)}
.desktop-nav [aria-current]::after {content:"";position:absolute;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--blue);left:1px;right:1px}
.mobile-nav {display:none}
main {padding:32px 0 64px;outline:none}

.dashboard {display:grid;grid-template-columns:minmax(0,1.74fr) minmax(0,1fr);gap:22px;align-items:start}
.card {background:white;border:1px solid var(--line);border-radius:18px;padding:25px 26px;box-shadow:0 2px 5px #242d4e03;min-width:0}
.section-title,.hgroup,.actions,.compose-actions,.action-end,.feed-heading,.job-top,.inline,.eyeline,.detail-meta,.detail-meta span,.resource-type {display:flex;align-items:center}
.section-title {justify-content:space-between;gap:10px}
.hgroup {gap:11px}
.tile {width:36px;height:36px;border-radius:11px;display:inline-grid;place-items:center;background:#edf1ff;color:var(--blue);flex:none}
.section-title :is(h1,h2),.feed-heading h1 {font-size:21px;line-height:1.3;letter-spacing:-1.1px;color:var(--ink)}
.load-sentence {display:flex;align-items:center;justify-content:center;gap:5px;padding:7px 10px;border:1px solid #dfe4ee;border-radius:8px;color:#56647e;font-size:14px;font-weight:650;white-space:nowrap}
.load-sentence .ico {width:15px;height:15px}
.load-sentence:hover,.subtle:hover,.icon-button:hover {background:#f3f5fc}
.compose label[for] {display:block;font-size:16px;line-height:1.6;font-weight:650;letter-spacing:-.6px;margin:20px 0 10px}
.textarea-wrap {position:relative;border:1px solid #dce1eb;border-radius:12px;background:#fafbfe;overflow:hidden}
.textarea-wrap:focus-within {border-color:#6681f1;box-shadow:0 0 0 3px #edf1ff}
textarea {display:block;resize:vertical;width:100%;min-height:122px;max-height:410px;line-height:1.65;padding:14px 16px 30px;background:transparent;border:0;outline:none;font-size:16px;letter-spacing:-.25px;color:var(--ink)}
textarea::placeholder {color:#788399}
.compose .project-source {display:flex;align-items:center;gap:8px;margin:12px 0 0;color:var(--muted);font-size:14px;font-weight:650;cursor:pointer}
.project-source input,.career-option input {width:18px;height:18px;accent-color:var(--blue);flex:none;margin:0}
.counter {position:absolute;right:13px;bottom:8px;font-size:12px;color:#748095;pointer-events:none;background:#fafbfe}
.counter b {font-weight:600;color:#626d82}
.compose-actions {justify-content:space-between;gap:8px;margin-top:14px;min-height:42px}
.local-cue {display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#727d90}
.local-cue .ico {width:15px;height:15px}
.primary,.subtle,.danger {display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:43px;border-radius:10px;padding:10px 17px;font-weight:700;font-size:15px}
.primary {color:white;background:var(--blue);box-shadow:0 2px 4px #344ac322}
.primary:hover {background:#2946ca}
.primary .ico {width:18px;height:18px}
.subtle {background:#f5f6fa;color:#505d75}
.danger {background:#b93643;color:white}
.actions,.action-end {gap:8px}
.action-end {justify-content:flex-end;margin-top:13px}
.stats {display:grid;grid-template-columns:1fr 1fr;margin:22px 0 17px;background:#f4f6ff;border:1px solid #e7ebfc;border-radius:12px;padding:17px 0}
.stats>button {padding:0 22px;text-align:left}
.stats>button+button {border-left:1px solid #dce3f6}
.stats>button:hover span {color:var(--blue);text-decoration:underline}
.stats>button .ico {width:14px;height:14px}
.stats span {display:block;color:#57647d;font-weight:600;font-size:14px}
.stats strong {display:block;line-height:1.2;margin-top:5px;color:#3655d6;font-family:Inter,"Malgun Gothic",sans-serif;font-size:34px;letter-spacing:-1.4px;font-weight:750}
.stats small {font-family:system-ui,sans-serif;color:#657393;font-size:15px;font-weight:550;margin-left:4px}
.board-note {font-size:14px;color:var(--muted);line-height:1.6}
.text-button,.back {color:var(--blue);font-size:14px;font-weight:700}
.text-button:hover,.back:hover,.resource-link:hover {text-decoration:underline}
.skill-row strong,.skill-row small {display:block}
.skill-row>.ico {width:16px;height:16px;color:#939db1}
.company-mark {width:39px;height:39px;display:inline-grid;place-items:center;border-radius:11px;font-family:"Arial Black",system-ui,sans-serif;font-size:20px;font-weight:850;flex:none}
.coral {background:#ffe9e0;color:#ae5029}.violet {background:#eae6ff;color:#7254bf}.sea {background:#d9f2eb;color:#257560}.gold {background:#fff1c8;color:#896419}.ocean {background:#ddebff;color:#2f64aa}.rose {background:#f9e2ec;color:#a84170}
.count {display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:650;border-radius:7px;padding:3px 8px;background:#f1f3f8;color:#606c82}
.count {background:var(--soft);color:var(--blue);margin-left:3px}
.state-message {margin-top:5px;font-size:14px;line-height:1.6;color:var(--muted)}
.chips {display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip {display:inline-block;border-radius:7px;background:#eff2ff;color:#415ab9;font-size:13px;font-weight:650;padding:5px 9px;line-height:1.3}
button.chip:hover {background:#e0e7ff}
.entry {padding:17px 0;border-bottom:1px solid var(--line)}
.entry:last-child {border:0;padding-bottom:0}
.entry-meta,.entry-tools {display:flex;align-items:center;gap:5px;font-size:13px;color:#68738b}
.entry-meta .ico {width:14px;height:14px}
.entry-tools {margin-left:auto}
.entry-tools button {font-size:14px;min-height:34px;padding:4px 6px}
.entry-tools button:hover {color:var(--blue)}
.entry p {white-space:pre-wrap;line-height:1.7;margin:3px 0 10px}
.review {margin-top:12px;border-top:1px solid var(--line);padding-top:16px}
.review h3,.project h3 {font-size:18px;letter-spacing:-.65px;outline:0}
.review>p,.project>p,.skill-intro p,.detail-intro>p,.resource p,dialog p {font-size:16px;color:#59657a;line-height:1.7;margin:7px 0 12px}
.suggestion {display:flex;align-items:center;gap:12px;padding:10px 2px;cursor:pointer;border-bottom:1px solid #eef0f6}
.suggestion input {accent-color:var(--blue);width:19px;height:19px}
.suggestion small,.skill-row small {display:block;color:var(--muted);font-size:14px;margin-top:3px}
.feed-heading {justify-content:space-between}
.muted {color:var(--muted);font-size:14px;gap:5px}
.inline .ico {width:16px;height:16px}
.filters {display:flex;gap:7px;margin:16px 0 18px;flex-wrap:wrap}
.filters button {font-size:14px;color:#59647a;border:1px solid #dce1eb;background:white;border-radius:9px;padding:8px 14px;font-weight:650}
.filters [aria-pressed="true"] {background:#263968;color:white;border-color:#263968}
.job-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.job {padding:20px;transition:border-color .15s,transform .15s}
.job:hover {border-color:#9eaff3;transform:translateY(-2px)}
.job-top {gap:8px}
.job-company {font-weight:650;font-size:14px}
.job-date {margin-left:auto;font-size:12px;color:#657186}
.job h2 {margin:16px 0 6px;font-size:21px;letter-spacing:-.9px}
.job-meta,.detail-meta {font-size:14px;color:#667186}
.job-meta span {padding:0 6px}
.job .chips {margin:16px 0}
.job-match,.match-head {border-top:1px solid var(--line);padding-top:13px;display:flex;align-items:center;justify-content:space-between;gap:9px;font-size:14px;color:#697387}
.job-match b,.match-head b {color:var(--blue);font-weight:650}
.match-meter {display:flex;gap:3px;flex-shrink:0}
.match-meter i {height:5px;width:15px;background:#e1e6ef;border-radius:4px}
.match-meter .on {background:#4969eb}
.detail {max-width:770px;margin:0 auto;display:grid;gap:17px}
.original-posting {display:flex;align-items:center;gap:12px}
.original-posting:hover {border-color:var(--blue);color:var(--blue)}
.original-posting small {display:block;margin-top:3px;color:var(--muted);font-size:14px}
.back {display:inline-flex;align-items:center;gap:5px;justify-self:start;min-height:36px}
.back .ico {width:16px;height:16px}
.detail-intro,.skill-intro {background:linear-gradient(120deg,#f0f4ff,#fff);border-color:#dbe3fa}
.eyeline {gap:9px;font-size:15px;font-weight:650}
.detail h1 {font-size:clamp(30px,4vw,43px);margin:14px 0 12px;letter-spacing:-1.8px}
.detail-meta {gap:12px;flex-wrap:wrap}
.detail-meta span,.resource-type {gap:5px}
.detail-meta .ico,.resource-type .ico,.resource-link .ico {width:16px;height:16px}
.detail-intro>p {margin:16px 0 0}
.match-head {border:0;background:#f4f6ff;border-radius:10px;padding:13px 16px;margin:18px 0 4px}
.skill-row {display:flex;align-items:center;gap:14px;padding:17px 2px;border-bottom:1px solid var(--line)}
.skill-row:last-child,.resource:last-child {border:0;padding-bottom:0}
.skill-row:hover .grow strong {color:var(--blue)}
.requirement-group {min-width:0;margin:16px 0 0;padding:0 0 12px;border:0;border-bottom:1px solid var(--line)}
.requirement-group:last-child {border:0;padding-bottom:0}
.requirement-group legend {padding:0;color:var(--ink);font-weight:750;font-size:15px}
.requirement-group legend span {margin-left:6px;color:var(--muted);font-weight:600;font-size:13px}
.career-option {cursor:pointer}
.interview ul {list-style:none;margin:14px 0 0;padding:0}
.interview li {line-height:1.6}
.interview li+li {border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.check-indicator {display:grid;place-items:center;width:23px;height:23px;border-radius:7px;border:2px solid #b5bfd2}
.matched {background:var(--blue);color:white;border-color:var(--blue)}
.matched .ico {width:16px;height:16px}
.grow {flex:1}
.resource,.evidence-row {padding:18px 0;border-bottom:1px solid var(--line)}
.resource-type,.evidence-row>small {font-size:13px;color:#62718c;font-weight:650}
.resource-link {display:inline-flex;align-items:center;gap:7px;margin-top:6px;color:#314cae;font-size:17px;font-weight:700}
.resource p,.deliverable p,.skill-intro p {margin-bottom:0}
.project h3 {margin-top:19px}
.deliverable {background:#f1f4ff;color:#3c5185;padding:14px 17px;border-radius:10px;margin:15px 0}
.deliverable p {line-height:1.65;margin-top:6px}
.evidence-row:last-child {border:0;padding-bottom:0}
dialog[open]:has(.skills-split) {display:flex;flex-direction:column;width:min(720px,calc(100% - 20px));max-height:88dvh;padding:0;overflow:hidden}
dialog:has(.skills-split)>.section-title {flex:none;padding:14px 20px;border-bottom:1px solid var(--line)}
.skills-split {display:grid;grid-template-columns:minmax(0,31%) minmax(0,1fr);min-height:0;height:clamp(228px,52dvh,410px)}
.owned-tabs,#owned-panel {min-width:0;overflow:auto;overscroll-behavior:contain}
.owned-tabs {padding:8px;background:#f6f8fc;border-right:1px solid var(--line)}
.owned-tabs button {display:block;width:100%;min-height:48px;padding:9px 10px;text-align:left;border-radius:8px}
.owned-tabs button+button {margin-top:2px}
.owned-tabs strong,.owned-tabs small {display:block}
.owned-tabs strong {font-size:15px;line-height:1.35}
.owned-tabs small,.owned-count {color:var(--muted);font-size:13px}
.owned-tabs small {margin-top:3px}
.owned-tabs [aria-selected="true"] {background:#e3eaff;color:#304bbd;box-shadow:inset 3px 0 var(--blue)}
.owned-tabs button:focus-visible {outline-offset:-2px}
#owned-panel {padding:18px 22px}
#owned-panel h3 {font-size:20px;letter-spacing:-.5px}
#owned-panel .owned-count {font-size:14px;margin:2px 0 12px}
#owned-panel .evidence-row {padding-top:12px;border-top:1px solid var(--line);border-bottom:0}
#owned-panel:focus-visible {outline:2px solid var(--blue);outline-offset:-3px}
blockquote {margin:10px 0;padding:10px 14px;background:#f4f6fc;border-left:3px solid #7388e5;line-height:1.7;white-space:pre-wrap}
dialog {color:var(--ink);border:1px solid var(--line);width:min(440px,calc(100% - 32px));max-height:80dvh;padding:24px;border-radius:18px;box-shadow:0 14px 70px #17274425}
dialog::backdrop {background:#151f37a3}
.icon-button {display:grid;place-items:center;border-radius:8px;width:36px;height:36px}
.dialog-actions {display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#message {position:fixed;z-index:5;bottom:24px;left:50%;transform:translate(-50%,10px);opacity:0;pointer-events:none;background:#25334d;color:white;padding:10px 17px;border-radius:10px;max-width:calc(100% - 30px);width:max-content;box-shadow:0 5px 16px #1113;transition:.15s ease;font-size:14px}
#message.visible {opacity:1;transform:translate(-50%,0)}
@media(max-width:940px) {
  .desktop-nav,main {width:calc(100% - 48px)} .card {padding:21px} .dashboard {gap:16px;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)} .stats>button {padding:0 14px}
  .job-grid {grid-template-columns:repeat(2,minmax(0,1fr))} .section-title :is(h1,h2) {font-size:19px} .hgroup {gap:8px}
}
@media(max-width:700px) {
  dialog:has(.skills-split)>.section-title {padding:10px 14px}
  .owned-tabs {padding:6px 4px}.owned-tabs button {padding:8px}
  #owned-panel {padding:14px 12px}#owned-panel blockquote {padding:8px 10px}
  .topbar {display:none}
  main {width:calc(100% - 32px)}
  .mobile-nav {position:fixed;z-index:3;background:#fffffff7;bottom:0;left:0;right:0;display:flex;justify-content:center;border-top:1px solid #dfe3ec;padding:3px 10px max(4px,env(safe-area-inset-bottom))}
  .mobile-nav a {flex:1;max-width:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;color:#737e92;font-size:13px;font-weight:650}
  .mobile-nav [aria-current] {color:var(--blue)}.mobile-nav [aria-current] .ico {stroke-width:2.1}
  main {padding:16px 0 calc(80px + env(safe-area-inset-bottom))}

  .dashboard {display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
  .card {padding:18px;border-radius:15px}.tile {width:32px;height:32px;border-radius:9px}.tile .ico {width:18px;height:18px}
  .section-title :is(h1,h2),.feed-heading h1 {font-size:19px}.load-sentence {font-size:13px;padding:7px 8px}.compose label[for] {font-size:15px;margin-top:16px}
  textarea {min-height:103px;padding:11px 12px 28px}.compose-actions {margin-top:10px}
  .stats {margin:15px 0 12px}.filters button {padding:8px 12px}
  .job-grid {grid-template-columns:1fr}.detail {gap:13px}.detail h1 {font-size:30px}.job h2 {font-size:21px}
  #message {bottom:calc(72px + env(safe-area-inset-bottom))}.resource-link {font-size:16px}
}
@media(max-width:355px) {
  main {width:calc(100% - 22px)}.card {padding:15px}
  .local-cue {font-size:12px}.hgroup {gap:6px}.load-sentence {font-size:12px}
}
@media(prefers-reduced-motion:reduce) {*,*::after,*::before {transition:none!important;scroll-behavior:auto!important}}

.side {display:grid;gap:22px;min-width:0}
.sync-card>p {font-size:15px;color:#59657a;line-height:1.65;margin:14px 0}
.sync-card .primary {width:100%}
.sync-card small {display:block;margin-top:10px;font-size:13px;color:#727d90}
.sync-steps {list-style:none;margin:18px 0 4px;padding:0;display:grid;gap:12px;font-size:15px;color:#8a93a6}
.sync-steps li {display:flex;align-items:center;gap:10px}
.sync-steps li::before {content:"";width:10px;height:10px;border-radius:50%;background:#d5dbe8;flex:none}
.sync-steps .now {color:var(--ink);font-weight:650}
.sync-steps .now::before {background:var(--blue);box-shadow:0 0 0 4px #e3eaff}
.sync-steps .done::before {background:#4969eb}
dialog[open]:has(.sync) {display:flex;flex-direction:column;width:min(720px,calc(100% - 20px));max-height:90dvh;padding:0;overflow:hidden}
dialog:has(.sync)>.section-title {flex:none;padding:14px 20px;border-bottom:1px solid var(--line)}
.sync {display:flex;flex-direction:column;min-height:0}
.sync-body {overflow:auto;overscroll-behavior:contain;padding:16px 20px 20px}
.sync-intro {display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.sync-intro p {margin:0;font-size:15px;line-height:1.6}
.sync-intro .text-button {flex:none;white-space:nowrap;min-height:34px;color:#96590c}
.sync-intro .text-button:disabled {color:var(--muted);cursor:default}
.sync-course {margin-top:20px}
.sync-course h3 {display:flex;align-items:baseline;gap:8px;font-size:17px;letter-spacing:-.5px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sync-course h3 span {font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
.sync-item {padding:12px 0;border-bottom:1px solid #eef0f6}
.sync-item:last-child {border-bottom:0;padding-bottom:0}
.sync-head,.sync-skill {display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.sync input {accent-color:var(--blue);width:18px;height:18px;flex:none;margin:2px 0 0}
.sync-head strong,.sync-skill strong {display:block;font-size:15px;line-height:1.45}
.sync small {display:block;margin-top:2px;font-size:13px;color:var(--muted);line-height:1.5}
.sync-item fieldset {min-width:0;margin:8px 0 0 28px;padding:0;border:0;display:grid;gap:6px}
.sync-item fieldset:disabled {opacity:.45}
.sync-item fieldset p {margin:0 0 2px;font-size:14px;line-height:1.6;color:#59657a}
.sync-skill {padding:8px 10px;border-radius:9px;background:#f6f8fc}
.sync-skill.doubt {background:#fff6e5;box-shadow:inset 3px 0 #e2a23a}
.sync-skill em {display:flex;align-items:flex-start;gap:5px;margin-top:4px;font-style:normal;font-size:13px;line-height:1.5;color:#8a5208;font-weight:600}
.sync-skill em .ico {width:14px;height:14px;margin-top:2px}
.sync-skipped {margin:16px 0 0;font-size:13px;color:var(--muted)}
.sync-foot {flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line);background:#fafbfe;font-size:14px;color:#59657a}
.sync-foot b {color:var(--blue)}
@media(max-width:940px) {.side {gap:16px}}
@media(max-width:700px) {
  .side {gap:14px}
  .sync-body {padding:12px 14px 16px}.sync-foot {padding:10px 14px}.sync-intro {flex-direction:column;gap:4px}
  .sync-item fieldset {margin-left:0}
}
.stats {grid-template-columns:repeat(3,1fr)}
.stats>button {padding:0 12px}
.stats span {font-size:13px}
.stats strong {font-size:29px}
.aspects {display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.aspect {display:inline-block;border:1px solid #cfd8f6;border-radius:999px;background:white;color:#415ab9;font-size:12px;font-weight:650;padding:3px 9px;line-height:1.3}
.aspect b {color:#7a86a8;font-weight:650}
.skill-row strong .aspect {margin-left:7px;vertical-align:1px}
#owned-panel h4 {margin:14px 0 0;font-size:14px;color:#56647e;font-weight:700}
#owned-panel h4 .count {font-size:12px;padding:2px 7px}
.list-tools {display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:9px 12px;border-radius:10px;background:#f4f6ff;font-size:13px;color:#59657a}
.list-tools .text-button {flex:none;white-space:nowrap;min-height:30px}
.entry-use {display:inline-flex;align-items:center;gap:5px;min-height:34px;padding:4px 6px;font-size:14px;cursor:pointer}
.entry-use input {width:17px;height:17px;margin:0;accent-color:var(--blue)}
.entry.off>p,.entry.off .chips {opacity:.45}
.new-skill {margin-left:7px;padding:2px 7px;border-radius:999px;background:#e3f4ea;color:#1f7a4d;font-size:11px;font-style:normal;font-weight:700;vertical-align:1px}
.sync-all {flex:none;display:inline-flex;align-items:center;gap:7px;min-height:34px;font-size:14px;font-weight:700;color:#505d75;white-space:nowrap;cursor:pointer}
.sync-all input {margin:0}
.sync-type {display:inline-block;margin-right:7px;padding:2px 8px;border-radius:999px;font-size:11px;font-style:normal;font-weight:700;vertical-align:1px;background:#e3eaff;color:#304bbd}
.sync-type.submission {background:#fdebd3;color:#8a5208}
.sync-item .chips small {margin:0 2px 0 0}
.project-card {margin:4px 0 10px}
.project-card summary {display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:#f4f6ff;cursor:pointer;list-style:none;line-height:1.5}
.project-card summary::-webkit-details-marker {display:none}
.project-card summary .ico {width:16px;height:16px;color:#7a86a8;transition:transform .15s}
.project-card[open] summary .ico {transform:rotate(90deg)}
.project-card>p {margin:10px 2px 8px;font-size:15px}
.project-card dl {margin:0 2px;display:grid;gap:8px}
.project-card dl div {display:grid;grid-template-columns:68px minmax(0,1fr);gap:8px;align-items:baseline}
.project-card dt {font-size:13px;font-weight:700;color:#62718c}
.project-card dd {margin:0;display:flex;flex-wrap:wrap;gap:5px;font-size:14px;line-height:1.5;color:#3c4763}
.entry.off .project-card {opacity:.45}
.entry-tools {flex:none;white-space:nowrap}
.entry-meta {flex-wrap:nowrap}
.stats {grid-template-columns:1fr 1fr}
.stats>button {padding:0 22px}
.stats span {font-size:14px}
.stats strong {font-size:34px}
.board-all {display:inline-block;margin-top:14px;min-height:30px}
@media(max-width:940px) {.stats>button {padding:0 14px}}
.review-project {margin-top:18px}

function route() {
  const [panel, jobId, skillId] = location.hash.slice(1).split("/");
  const job = panel === "jobs" && jobs.find(item => item.id === jobId);
  const criterion = job && job.requirements.find(([id,,,,,mode]) => id === skillId && mode !== "eligibility");
  return {panel:panel === "jobs" ? "jobs" : "journal", job, criterion};
}
function syncIndex() {
  evidence = new Map();
  for (const activity of activities) {
    if (activity.off) continue;
    for (const item of activity.matches) {
      if (!evidence.has(item.id)) evidence.set(item.id, []);
      evidence.get(item.id).push({activity, item});
    }
  }
  const completed = new Map(activities.map(activity => [activity, completedClauses(activity.text).join("\n")]));
  criterionEvidence = new Map(jobs.flatMap(job => job.requirements).map(criterion => {
    const [id,,patterns,,,mode,skill = id,aspect] = criterion;
    if (mode === "eligibility") return [criterion, []];
    const matches = (evidence.get(skill) || []).filter(({activity,item}) =>
      (mode !== "project" || activity.project === true)
      && skills[skill].pattern.test(item.trigger)
      && (!aspect || matchAspects(activity,item).includes(aspect))
      && patterns.every(pattern => pattern.test(completed.get(activity))));
    return [criterion, matches];
  }));
}

function review() {

// A project shows as its name; pressing it opens the tags attached to it.
function projectBody(a) {
  const cut = a.source ? a.text.indexOf(": ") : -1;
  const name = a.title || (cut > 0 ? a.text.slice(0, cut) : a.text.split(/[.\n]/)[0]);
  const from = a.source || {};
  const subs = [...new Set(a.matches.flatMap(item => matchAspects(a,item)))];
  const rows = [
    ["스킬", a.matches.map(m => chip(m.id)).join("")],
    ["세부 역량", subs.map(sub => `<span class="aspect">${escape(sub)}</span>`).join("")],
    // Details the model pulled out of a written record: [label, [values]].
    ...(a.tags || []).map(([label,values]) => [label, values.map(value => `<span class="aspect">${escape(value)}</span>`).join("")]),
    ["목적", from.purpose ? escape(from.purpose) : ""],
    ["형태", [from.team ? "팀 프로젝트" : "", from.count > 1 ? from.count + "회 제출" : ""].filter(Boolean).join(" · ")],
    ["출처", from.course ? escape([from.course, from.term, from.origin].filter(Boolean).join(" · ")) : ""]
  ].filter(([,value]) => value).map(([label,value]) => `<div><dt>${label}</dt><dd>${value}</dd></div>`).join("");
  return `<details class="project-card"><summary><strong>${escape(name)}</strong>${icon("chev")}</summary><p>${escape(cut > 0 ? a.text.slice(cut + 2) : a.text)}</p><dl>${rows}</dl></details>`;
}

  if (!event.target.matches("input[data-skill]")) return;
  const {skill}=event.target.dataset;
  if (event.target.checked) draft.selected.add(skill); else draft.selected.delete(skill);
});
document.addEventListener("click", event => {
  const el=event.target.closest("[data-action]");
  if (!el) return;
  const {action,id,skill,filter,use}=el.dataset;
  // Reading stored skills, projects or records: the deck shows the matching lookup diagram.
  if (["skills","evidence","projects","activities"].includes(action)) tellDeck(action);
  // eclass sync: fetching and extracting, then saving what the user confirmed.
  if (action === "sync-open" || action === "sync-apply") tellDeck(action);
  if (action === "close") dialog.close();
  else if (action === "confirm") {const run=modalAction; dialog.close(); run?.();}
  else if (action === "retry") refresh();
  else if (action === "sync-open") openSync();
  else if (action === "sync-apply") {el.disabled=true; applySync();}

  else if (action === "load-sentence") {
    tellDeck("load-sentence");
    discardThen(()=>{draft.text=activitySentence; draft.suggestions=null; render(); editFocus();});
  }
  else if (action === "extract") {
    const input=document.querySelector("#activity");
    if (!draft.text.trim()) {input.setCustomValidity("활동 내용을 먼저 적어 주세요."); input.reportValidity(); input.setCustomValidity(""); input.focus(); return;}
    draft.suggestions=extractSkills(draft.text);
    // An edited record stays a project if it was one, even when the wording no longer says so.
    draft.found=extractProject(draft.text, draft.suggestions) || (draft.original?.project ? {name:draft.original.title || "프로젝트", tags:draft.original.tags || []} : null);
    draft.project=Boolean(draft.found);
    tellDeck("extract");
    // An edit keeps manual exclusions unless the user adds a new skill to the text.
    const oldFound = draft.original ? extractSkills(draft.original.text).map(m=>m.id) : [];
    draft.selected=new Set(draft.suggestions.filter(m=>!oldFound.includes(m.id) || draft.original?.matches.some(old=>old.id===m.id)).map(m=>m.id));
    el.hidden=true;
    document.querySelector("#review-slot").innerHTML=review();
    document.querySelector("#review-title").focus();
  } else if (action === "save" && draft.suggestions !== null) {el.disabled=true; tellDeck("save"); persist();}
  else if (action === "filter") {jobFilter=filter; render(); document.querySelector('[aria-pressed="true"]').focus({preventScroll:true});}
  else if (action === "activities" || action === "projects") openActivities(action === "projects");
  else if (action === "use-all") setUse(activities.filter(a => (!listProjects || a.project) && Boolean(a.off) !== (use === "off")), use === "off");
  else if (action === "skills" || action === "evidence") openOwnedSkills(skill);
  else if (action === "select-skill") selectOwnedSkill(skill);
  else if (action === "edit") {
    const a=activities.find(item=>item.id===id);
    if (a) {dialog.close(); discardThen(()=>useDraft({...blank(),text:a.text,project:a.project === true,original:a}));}
  } else if (action === "cancel-edit") {
    const back=draft.returnTo;
    draft=blank(); if(back) location.hash=back; else render();
  } else if (action === "project") {
    const {job}=route();
    discardThen(()=>useDraft({...blank(),project:true,returnTo:"jobs/"+job.id}));
  }
});
dialog.addEventListener("close", () => { sync = null; syncRun++; });
dialog.addEventListener("keydown", event => {
  const tab = event.target.closest('[role="tab"]');
  if (!tab || !["ArrowUp","ArrowDown","Home","End"].includes(event.key)) return;
  event.preventDefault();
  const tabs = [...tab.parentElement.querySelectorAll('[role="tab"]')];
  let index = tabs.indexOf(tab);
  if (event.key === "Home") index = 0;
  else if (event.key === "End") index = tabs.length - 1;
  else index = (index + (event.key === "ArrowDown" ? 1 : -1) + tabs.length) % tabs.length;
  selectOwnedSkill(tabs[index].dataset.skill);
});
dialog.addEventListener("click",event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect(); if(event.clientX<r.left || event.clientX>r.right || event.clientY<r.top || event.clientY>r.bottom) dialog.close();}});
window.addEventListener("hashchange",()=>{render();
  // Opening the 채용 공고 list, or one posting (and its requirements): the deck shows the matching diagram.
  if (route().panel === "jobs") tellDeck(route().job ? "job-detail" : "jobs"); window.scrollTo(0,0); if(route().panel==="journal" && draft.returnTo) editFocus(); else main.focus({preventScroll:true});});
channel?.addEventListener("message",()=>refresh());
window.addEventListener("pageshow",e=>{if(e.persisted) refresh();});
window.addEventListener("storage", event => {
  if (event.key === careerKey || event.key?.startsWith(eligibilityPrefix)) render();
});
render();
refresh();
// Offline caching only exists for the hosted app. The single-file build (opened from disk or embedded
// in presentation.html) has no sw.js beside it and inlines its styles, so it must not try or warn.
if (/^https?:$/.test(location.protocol) && document.querySelector('link[rel="stylesheet"]') && "serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(() => notice("오프라인 저장을 준비하지 못했어요."));
}

</script>
